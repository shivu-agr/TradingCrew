# =============================================================================
# TradingCrew tasks
# =============================================================================
# Task graph (sequential, with async_execution wired in code for the analyst
# fan-out and context= chains wired in code from the @task decorators):
#
#   5 analysts (parallel via async_execution=True)
#     -> DEBATE_ROUNDS x (Bull -> Bear)
#       -> Research Manager synthesis
#           -> Trader plan
#             -> RISK_ROUNDS x (Aggressive -> Conservative -> Neutral)
#                 -> Portfolio Manager (typed PortfolioDecision + guardrail)
#
#   Quality Reviewer audit (optional) + Compliance Officer (optional) run
#   ASYNC / advisory: they are wired as PM-context inputs (not trader
#   gates) so they overlap the trader/risk stretch instead of extending
#   the critical path.  Both are toggle-controlled and default OFF.
#
# {ticker} is substituted from the kickoff inputs dict.
#
# Provenance rule (enforced in every task description below)
# -----------------------------------------------------------
# Every numeric / quantitative claim MUST end with an inline tag
# ``[source: <identifier>]`` whose ``<identifier>`` is the text printed
# on the matching tool's ``Source: …`` footer.  Downstream tasks
# (manager, QA, trader, risk, compliance, PM) MUST preserve those tags
# verbatim when they paraphrase or summarise.  The Portfolio Manager
# emits the deduplicated set of identifiers in the ``sources`` field of
# its typed ``PortfolioDecision`` — that's how the Reflective Critic
# distinguishes real data from hallucinated numbers.
#
# REPORT FORMAT contract (enforced in every analyst task below)
# -------------------------------------------------------------
# Every analyst report MUST open with a 3-5 line ``TLDR:`` block:
#
#     TLDR:
#     - <one-line headline finding with [source: …] tag>
#     - <one-line headline finding with [source: …] tag>
#     - Bias: bullish / bearish / neutral
#
# This lets the Research Manager / Trader / PM read just the TLDR block
# of every upstream report when the LLM has a smaller context window
# (e.g. Gemma-4 at ~42K tokens), and gives the OSS-120B tool-loop a
# clear "I'm done — write the summary now" signal instead of looping
# on more tool calls.  The full body that follows is still rendered in
# the Reports tab and consumed by the LLM verbatim when the window has
# room — but the TLDR is the canonical compacted form.
#
# Tool budget (helps with OSS-120B tool-loop degradation pattern on
# tool-heavy Indian-ticker runs)
# ----------------------------------------------------------------
# Tool-heavy tasks (news, social, geopolitical) state an explicit MAX
# number of tool calls; once exhausted the analyst MUST stop calling
# tools and write the report from whatever it has, rather than
# emitting another tool-call object as the final answer.
# =============================================================================

# ----- Analyst phase (all 4 run with async_execution=True in code) ----------
#
# The five desks below: four were consolidated from an earlier eight-analyst
# layout, and a fifth (Reports / Guidance) was added back to read the
# company's own filings.  Each covers a wider remit under a batched tool budget:
#   * market_analyst        = price/technicals + options/positioning (was market + quant)
#   * news_analyst          = catalysts + corporate actions + sentiment + insider (was news + social)
#   * fundamentals_analyst  = financials + long-term thesis + sector/peers (was fundamentals + sector)
#   * reports_analyst       = primary filings / management guidance / target-vs-actual
#   * macro_analyst         = macro regime + geopolitical + supply-chain (was macro + geopolitical)

market_task:
  description: >
    Analyze the price action AND option-implied positioning of {ticker}.

    Tool budget: call each tool AT MOST ONCE, then write the report.
    Do NOT loop for more calls — emitting another tool call instead of
    a final report counts as task failure.

    When the tools have returned, WRITE THE REPORT immediately.  Do NOT
    narrate your tool usage ("Let me get…", "Now let me…", "I'll fetch…")
    — the report is the ONLY output, and a narration of tool calls
    instead of a report is a task failure.

    Mandatory order:
      1. get_stock_data — 5-year OHLCV (5y overview + monthly
         aggregates + last 30 daily sessions).
      2. get_indicators — SMA20/SMA50/SMA200/RSI14/60d-return/1y-return.
      3. get_options_summary — ATM IV, put/call ratio and OI (what the
         options market is pricing in).  If the ticker has no listed
         options the tool says so — note it and move on.
      4. get_analyst_recommendations — sell-side consensus + price
         targets (what the street is pricing in).

    Identify the trend regime (uptrend / downtrend / range) using BOTH
    the multi-year monthly trend and the recent daily action, key
    levels, divergences, the implied move, and how the options / street
    view lines up with (or contradicts) the chart.

    PROVENANCE: every number you write (price, SMA, RSI, return %, IV,
    put/call, target) MUST be followed by an inline tag
    ``[source: <identifier>]`` copied verbatim from the matching tool's
    "Source: …" footer (e.g. ``[source: yfinance OHLCV NTNX (5y,
    indicators)]``, ``[source: yfinance option_chain {ticker} expiry=…]``,
    ``[source: yfinance recommendations_summary {ticker}]``). Do NOT
    write a number you can't cite — say "not available" instead.  A
    qualitative read with no citable figure must be labelled
    ``[analyst judgement]`` — never invent a URL or placeholder link
    (``example.com``) to satisfy this rule.
  expected_output: >
    A MARKET REPORT that opens with a ``TLDR:`` 3-line block
    (trend regime + implied move / positioning + bias) and then lists
    trend regime, last close, SMA20/SMA50/RSI14, momentum read, the
    implied move + put/call read, sell-side consensus, and a 1-line
    bias (bullish / bearish / neutral).  Keep under ~2000 chars.  Every
    number must carry an inline ``[source: <identifier>]`` tag.
    The VERY LAST line of the report MUST be the canonical machine tag
    ``DESK_BIAS: BULLISH`` (or ``BEARISH`` / ``NEUTRAL``) — exactly one
    uppercase word, alone on its line — so the desk's directional lean is
    read deterministically downstream.  This is REQUIRED, not optional.

news_task:
  description: >
    Find material news catalysts AND read the sentiment / tone for
    {ticker}.

    Tool budget: AT MOST 5 tool calls in this fixed order.  After the
    fifth tool returns you MUST stop calling tools and write the
    report.  Emitting more tool calls instead of a final report
    counts as task failure.

    When the tools have returned, WRITE THE REPORT immediately.  Do NOT
    narrate your tool usage ("Let me get…", "Now let me…", "I'll fetch…")
    — the report is the ONLY output, and a narration of tool calls
    instead of a report is a task failure.

    Mandatory order:
      1. Call get_market_context({ticker}) ONCE. The brief is FACTS
         (country, industry, name) — not a canned theme list. Do NOT
         default to US-centric headlines unless the brief says the
         company is US-listed.
      2. From the brief + your catalyst remit + any gap you still have,
         write a 6-12 word query and call get_news({ticker},
         query="<your query>").
      3. Call get_corporate_actions({ticker}) — this is the **specific**
         hook for buybacks, dividends, splits, M&A, guidance updates,
         and board / management changes that the generic
         ``get_news`` sentiment query routinely misses.  If the company
         has announced a share buyback, dividend, acquisition, or
         leadership change during the analysis window it will surface
         here.  Treat any hits as first-class catalysts in the report,
         even if get_news did not surface them.
      4. Write a home-country macro query from the brief (central bank,
         FX, inflation for THAT country) and call
         get_global_news({ticker}, query="<your query>").
      5. Call get_insider_transactions for executive activity.

    Tie each headline to a likely impact (positive / negative / neutral),
    and summarize the dominant narrative + tone (positive / negative /
    mixed) and any sentiment shift.  Treat a buyback / special dividend /
    acquisition announcement as a **first-tier catalyst** — name it
    explicitly under a dedicated "Corporate actions" subsection (or note
    "none in window" if get_corporate_actions returned no hits).

    PROVENANCE: every catalyst line ends with the article's URL as
    ``[source: <url>]``. Insider-activity counts / dollar values end
    with ``[source: yfinance insider_transactions {ticker}]``.
    If you state a qualitative catalyst, sentiment read, or context that
    has no citable URL from the tools (reasoned domain knowledge — e.g.
    "the domestic capex upcycle supports order inflow"), label it
    ``[analyst judgement]`` — an explicit, honest tag.  NEVER invent a
    URL or a placeholder link (``example.com``, a made-up path) to
    satisfy this rule: a fabricated citation is worse than an honest
    ``[analyst judgement]`` label and will be flagged and stripped
    downstream.
  expected_output: >
    A NEWS & SENTIMENT REPORT that opens with a ``TLDR:`` 3-5 line block
    (top company catalyst + top corporate action + overall sentiment +
    bias) and then has: a CORPORATE ACTIONS subsection (buyback /
    dividend / split / M&A / guidance / board — each hit cited with
    its ``[source: <url>]`` URL, or one line "none in window" if
    get_corporate_actions found nothing), 3-5 company catalysts (drawn
    from queries YOU wrote off the brief's country + industry — not
    generic US macro lines), an overall sentiment / dominant-narrative
    read, 2-3 macro
    items from the company's HOME-COUNTRY basket, insider activity
    summary, and 1-line bias.  Keep under ~2800 chars total.  Every
    numeric claim and every headline carries an inline
    ``[source: <url-or-identifier>]`` tag.
    The VERY LAST line of the report MUST be the canonical machine tag
    ``DESK_BIAS: BULLISH`` (or ``BEARISH`` / ``NEUTRAL``) — exactly one
    uppercase word, alone on its line — so the desk's directional lean is
    read deterministically downstream.  This is REQUIRED, not optional.

fundamentals_task:
  description: >
    Evaluate the fundamentals of {ticker} across BOTH the near-term
    (last 1-2 years) AND the LONG (5-10 year) horizon, AND place the
    name against its sector peers.

    Tool budget: call each tool AT MOST ONCE, then write the report.
    Exception: get_sector_peers may be called a second time only to
    pass peers= after you reject a live set as the wrong industry
    or country.

    When the tools have returned, WRITE THE REPORT immediately.  Do NOT
    narrate your tool usage ("Let me get…", "Now let me…", "I'll fetch…")
    — the report is the ONLY output, and a narration of tool calls
    instead of a report is a task failure.

    Mandatory tool sequence:
      1. get_fundamentals — snapshot ratios (P/E, EPS, margins).
      2. get_balance_sheet + get_cashflow + get_income_statement —
         near-term Ind-AS / GAAP statement view.
      3. get_shareholding_pattern (Indian tickers only) — promoter
         / FII / DII / public drift.
      4. **get_long_term_thesis** — required.  This is the aggregator
         the PM anchors the LONG-tier decision on: revenue / net-profit
         / EPS CAGR over the longest available window, ROCE trend,
         debt trajectory, and screener.in's structural pros/cons.
         For Indian names this is ~10y of Ind-AS data; for global
         names it degrades to 3-4y of yfinance annuals (and the tool
         says so explicitly — quote that caveat).  This tool is
         BACKWARD-LOOKING (trailing statements only).
      5. **get_forward_estimates** — required.  The FORWARD counterweight
         to step 4: analyst price target + implied upside, forward vs
         trailing P/E and EPS (the earnings *trajectory*), consensus
         earnings / revenue growth for the current and next fiscal year,
         EPS-revision momentum, and the rating distribution.  Use it so
         the call weighs where the business is HEADING, not only where it
         has been.  If coverage is sparse the tool says so — do not invent
         estimates.
      6. get_sector_peers({ticker}) — live Yahoo industry + country
         screen (not a ticker dictionary). Always pass ticker={ticker};
         an empty argument object is a failed call. Quote the tool's
         "Focus alpha vs median" line; do not recompute it. If a row
         is INDUSTRY_MISMATCH or the set is the wrong country, you may
         call get_sector_peers({ticker}, peers="<space-separated
         yfinance tickers you already saw in a filing or tool output>")
         a second time. Do not invent tickers.

    Assess growth, profitability, balance-sheet strength, free-cash-flow
    quality, the multi-year compounding quality, AND relative strength
    vs peers.

    Write the report in TWO sections so the trader + PM can consume it
    at the appropriate horizon:
      * "Near-term view (SHORT / MEDIUM)": current-year snapshot,
        margin trajectory, quarterly print, alpha vs median peer, AND
        the FORWARD consensus from get_forward_estimates — implied upside
        to the mean target, the forward-vs-trailing P/E / EPS trajectory,
        next-FY earnings & revenue growth, and revision momentum.
      * "Long-term view (LONG)": revenue / EPS CAGR, ROCE trend,
        debt trajectory, shareholding stability, structural
        pros/cons.  If the CAGR is negative or ROCE is degrading,
        flag it as a value-trap warning — the PM must NOT pick
        horizon=LONG on a broken compounder thesis.
      * RECONCILE past vs future: when the trailing trend
        (get_long_term_thesis) and the forward consensus
        (get_forward_estimates) disagree — e.g. a soft trailing print but
        rising forward EPS and a positive target — say so explicitly and
        state which one the thesis leans on and WHY.  Do not let a weak
        past silently override a strong forward setup, or vice-versa.

    PROVENANCE: every metric (P/E, EPS, revenue, margin, growth, CAGR,
    peer figure) must carry ``[source: <identifier>]`` — typically
    ``[source: yfinance .info {ticker} (fundamentals)]`` or
    ``[source: screener.in ... #profit-loss]`` or
    ``[source: screener.in ... #ratios]`` or
    ``[source: yfinance OHLCV + .info peer basket [...] (YTD)]``.
    Forward-consensus figures carry the estimate-specific tag the tool
    prints — ``[source: yfinance analyst_price_targets {ticker}]``,
    ``[source: yfinance earnings_estimate {ticker}]``,
    ``[source: yfinance revenue_estimate {ticker}]``, or
    ``[source: yfinance eps_revisions {ticker}]``.  A
    qualitative structural read with no citable figure (e.g. "the
    franchise has durable pricing power") must be labelled
    ``[analyst judgement]`` — never invent a URL or placeholder link
    (``example.com``) to satisfy this rule.
  expected_output: >
    A FUNDAMENTALS & SECTOR REPORT that opens with a ``TLDR:`` 3-5 line
    block (growth pct + margin + leverage + alpha vs median peer +
    forward outlook: implied upside + fwd-vs-trailing EPS direction +
    long-term compounder bias) and then splits into "Near-term view"
    and "Long-term view" sections.  The near-term view MUST cite the
    forward consensus (implied upside to the mean target AND the
    forward-vs-trailing EPS / P/E direction) whenever get_forward_estimates
    returned data (say "sparse coverage" if it did not).  The long-term
    view MUST cite at least one CAGR line drawn from get_long_term_thesis.
    Cite a ROCE
    trend ONLY when the tool actually returned one (the screener.in path
    does; the yfinance fallback does NOT — in that case write "ROCE trend
    not available via yfinance" rather than inventing figures).  NEVER
    cite a metric or a fiscal-year range the tool did not print, and
    never attach a ``get_long_term_thesis`` source tag to a number that
    is not in its output.  Keep under ~3800 chars.  Every figure cited
    carries an inline ``[source: <identifier>]`` tag.
    The VERY LAST line of the report MUST be the canonical machine tag
    ``DESK_BIAS: BULLISH`` (or ``BEARISH`` / ``NEUTRAL``) — exactly one
    uppercase word, alone on its line — reflecting your net near-term +
    long-term lean, so it is read deterministically downstream.  REQUIRED.

reports_task:
  description: >
    Read {ticker}'s OWN primary filings and extract the MANAGEMENT
    GUIDANCE / TARGETS, the TARGET-vs-ACTUAL delivery record, and the
    forward outlook — the signal the restated ratio tables never show.

    Tool budget: AT MOST 3 tool calls in this fixed order.  After the
    third tool returns you MUST stop calling tools and write the report.

    When the tools have returned, WRITE THE REPORT immediately.  Do NOT
    narrate your tool usage ("Let me get…", "Now let me…", "I'll fetch…")
    — the report is the ONLY output, and a narration of tool calls
    instead of a report is a task failure.

    Mandatory order:
      1. get_market_context({ticker}) — learn the country + industry so
         you frame guidance in context (and know whether primary filings
         are even available for this name).
      2. **get_report_insights({ticker})** — the core tool.  It pulls
         {ticker}'s primary filings — for INDIAN names the concall /
         earnings-call transcripts, investor presentations, annual-report
         MD&A and credit-rating rationales from screener.in; for US names
         the SEC EDGAR 10-K / 10-Q reports (MD&A / outlook) and earnings
         8-Ks (results + guidance) — crawls the (large) documents and
         returns an LLM-summarised digest.  The digest LEADS with a
         **REPORT TREND SIGNALS card**: directional, confidence-scored
         signals (OUTLOOK_TONE, REVENUE_GUIDANCE raised/maintained/cut,
         MARGIN_GUIDANCE, DELIVERY_TRACK_RECORD beat/in-line/miss,
         DEMAND_MOMENTUM, CREDIT_TRAJECTORY, and a synthesised
         NET_GUIDANCE_BIAS), then the supporting evidence (explicit
         guidance/targets with periods, target-vs-actual, forward outlook
         + tone, credit action).  If the name is in NEITHER feed (e.g. a
         London/HK listing) it returns a clear "not available" note — in
         that case DO NOT invent guidance.
      3. get_forward_estimates({ticker}) — the forward-CONSENSUS
         counterweight (analyst targets, forward-vs-trailing EPS, revision
         momentum).  This works everywhere, so it is your primary source
         when step 2 reported "not available".

    Your report is SPECIFICALLY about {ticker}'s OWN primary filings —
    NEVER a generic market summary, and NEVER a reply to a generic
    "summarize the market" prompt.  Write the report from the data the
    tools actually returned in context (get_report_insights /
    get_forward_estimates).  If a tool returned "not available", say so
    plainly — do NOT substitute general-knowledge or unrelated market
    commentary for the missing {ticker} data.

    Write what management COMMITTED to vs what they DELIVERED, and whether
    the delivery record earns their current outlook credibility.  Carry the
    REPORT TREND SIGNALS card THROUGH to your report verbatim (it is the
    desk's headline read) — do NOT drop or re-score it.  If no explicit
    guidance/target exists in the filings, say so — never manufacture a
    target or a signal direction the filings don't support.

    PROVENANCE: cite every guidance figure / delivery datapoint with the
    inline ``[source: <url>]`` tag carried by get_report_insights (each
    filing's URL) or the get_forward_estimates source line.  A qualitative
    read with no citable figure must be labelled ``[analyst judgement]`` —
    never invent a URL or a placeholder link (``example.com``) to satisfy this rule.
  expected_output: >
    A REPORTS & GUIDANCE briefing that opens with a ``TLDR:`` 3-4 line
    block LEADING with the NET_GUIDANCE_BIAS (POSITIVE / NEUTRAL / NEGATIVE
    + confidence) and the 2-3 strongest trend signals (e.g. "revenue
    guidance RAISED, delivery BEAT 3/4, tone BULLISH"), then the latest
    explicit guidance/target and the most recent target-vs-actual verdict.
    Immediately after the TLDR, reproduce the **REPORT TREND SIGNALS**
    card verbatim from get_report_insights.  Then: (1) Management guidance
    / targets, (2) Target vs actual delivery (beat / miss / in-line), (3)
    Forward outlook & tone + named risks, (4) Credit / balance-sheet
    actions if any.  If get_report_insights reported no primary filings
    (name in neither the Indian nor US feed, or none on record), say so
    explicitly in the TLDR (signals = INSUFFICIENT_DATA) and fall back to
    the get_forward_estimates consensus view — do NOT fabricate management
    targets.  Keep under ~3400 chars.  Every figure carries an inline
    ``[source: …]`` tag.
    The VERY LAST line of the report MUST be the canonical machine tag
    ``DESK_BIAS: BULLISH`` (or ``BEARISH`` / ``NEUTRAL``) — exactly one
    uppercase word, alone on its line, mapping your NET_GUIDANCE_BIAS
    (POSITIVE→BULLISH, NEGATIVE→BEARISH, else NEUTRAL) so it is read
    deterministically downstream.  REQUIRED (use NEUTRAL if INSUFFICIENT_DATA).

macro_task:
  description: >
    Assess the macro regime AND the geopolitical / supply-chain risk
    for {ticker} — anchored to the COUNTRY where it is listed and its
    INDUSTRY, not the US / US-China baseline.

    Tool budget: AT MOST 5 tool calls in this fixed order.  After the
    fifth tool returns you MUST stop calling tools and write the
    report.  Emitting more tool calls counts as task failure (this was
    the degraded-output failure mode on tool-heavy runs).

    When the tools have returned, WRITE THE REPORT immediately.  Do NOT
    narrate your tool usage ("Let me get…", "Now let me…", "I'll fetch…")
    — the report is the ONLY output, and a narration of tool calls
    instead of a report is a task failure.

    Mandatory order:
      1. Call get_market_context({ticker}) ONCE. The brief is FACTS
         (country, currency, sector, industry, macro-ticker symbols).
         It does not hand you Hormuz / TSMC / Fed phrases — you name
         the chokepoint that follows from THIS country + industry.
      2. Call get_macro_data({ticker}) — levels for the brief's
         country macro-ticker symbols.
      3. Write a 6-12 word home-country macro query (central bank, FX,
         inflation for that country) and call
         get_global_news({ticker}, query="<your query>").
      4. From the brief + your remit (tariffs, export controls,
         sanctions, regional chokepoints) + any gap still open, write
         a 6-12 word query and call
         get_geopolitical_news({ticker}, query="<your query>").
      5. Same for suppliers / OEMs / shortages:
         get_supply_chain_risk({ticker}, query="<your query>").

    State whether the regime is risk-on or risk-off in the COMPANY'S
    home country, how it tilts a {ticker} position (translate FX moves
    into a P&L direction — a stronger INR is a tailwind for an Indian
    importer, headwind for an exporter), and 3-5 active geopolitical /
    supply-chain risks tied to the country + industry.  Quantify
    exposure where possible ("X% of revenue from region Y", "top
    customer is Z% of revenue").  Do NOT invent percentages.

    PROVENANCE: cite macro levels with the macro-data Source line
    (e.g. ``[source: yfinance OHLCV macro basket (India) [...] (2mo)]``);
    cite news / risk items with their per-row URL as ``[source: <url>]``.
    A qualitative regime or geopolitical read with no citable URL must
    be labelled ``[analyst judgement]`` — never invent a URL or
    placeholder link (``example.com``) to satisfy this rule.
  expected_output: >
    A MACRO & GEOPOLITICAL REPORT that opens with a ``TLDR:`` 3-line
    block (regime + top active risk + tilt) and then has: the regime
    call for the company's home country, top 3 macro signals from that
    country's basket (each with its inline ``[source: …]`` tag), 3-5
    geopolitical / supply-chain risks tied to the country + industry
    with exposure estimates, and a 1-line tilt on the trade.  Keep
    under ~2800 chars.  Every claim carries an inline ``[source: …]``
    tag.
    The VERY LAST line of the report MUST be the canonical machine tag
    ``DESK_BIAS: BULLISH`` (or ``BEARISH`` / ``NEUTRAL``) — exactly one
    uppercase word, alone on its line, reflecting how the macro +
    geopolitical regime tilts the trade, so it is read deterministically
    downstream.  This is REQUIRED, not optional.

# ----- Bull / Bear debate (per-round tasks generated in code) ---------------

bull_round:
  description: >
    Debate round {round_num} of {total_rounds} (BULL turn) for {ticker}.
    Analyst reports and prior turns are NOT dumped into this task's
    context. Start by calling read_scratchpad ONCE — that shared pad
    holds compact analyst TLDRs, prior debate turns, and live notes.

    Tool budget (hard, at most 4 calls this turn):
      1. read_scratchpad (required, first).
      2. Optional NEW-evidence calls with a fresh query — research_web
         ("<specific claim to support or rebut>"), get_news("{ticker}"),
         and/or get_event_proximity("{ticker}"). Do not re-ask what is
         already on the pad.
      3. Optional request_evidence if a missing number is owned by an
         analyst desk (cap 2 per run).
      4. write_scratchpad with compact NEW claims or tool findings
         (author=bull). Your finished 4-6 bullets are copied onto the
         pad automatically — do not paste that whole turn.

    Then state the strongest bullish argument in 4-6 bullets, each tied
    to a scratch-pad TLDR, a prior debate turn, or a tool you just called.

    Round-{round_num} discipline (REQUIRED — the runner persists every
    round separately now, so duplicate rounds are visible to the
    reviewer):
      * If round_num == 1: open with your strongest 4-6 drivers.
      * If round_num > 1: this turn MUST be materially different from
        your round (round_num - 1).  Specifically:
          (a) Open with a one-line "REBUTTAL:" pasting the exact bear
              bullet (with its ``[source: …]`` tag) that you are
              attacking, then explain in 1-2 lines why it does not
              hold.  Repeat for the next strongest bear bullet if
              space allows.
          (b) Introduce AT LEAST ONE driver from an analyst lens you
              did not lead with in earlier rounds (news / social /
              macro / geopolitical / sector / quant), so the new round
              is not a paraphrase of round (round_num - 1).
          (c) State explicit conviction direction vs the prior round:
              "Conviction vs prior round: ↑ / → / ↓ — because <one
              line citing what shifted>."
          (d) Do NOT repeat verbatim any bullet from your earlier
              round; if a driver still applies, restate it in fewer
              words and add what's new since.

    PROVENANCE: copy each ``[source: <identifier>]`` tag verbatim from
    the pad or from a tool you called this turn. You MAY introduce
    numbers that came from those tool calls, with their tags. Do NOT
    invent numbers.
  expected_output: >
    Bull argument for round {round_num} (bulleted; for round_num > 1
    starts with one or more ``REBUTTAL:`` lines that paste the bear
    bullet under attack, ends with a ``Conviction vs prior round:``
    line, and introduces at least one previously-unused analyst
    lens).  Every numeric claim keeps its ``[source: …]`` tag.

bear_round:
  description: >
    Debate round {round_num} of {total_rounds} (BEAR turn) for {ticker}.
    Analyst reports and prior turns are NOT dumped into this task's
    context. Start by calling read_scratchpad ONCE — that shared pad
    holds compact analyst TLDRs, prior debate turns, and live notes.

    Tool budget (hard, at most 4 calls this turn):
      1. read_scratchpad (required, first).
      2. Optional NEW-evidence calls with a fresh query — research_web
         ("<specific claim to support or rebut>"), get_news("{ticker}"),
         and/or get_event_proximity("{ticker}"). Do not re-ask what is
         already on the pad.
      3. Optional request_evidence if a missing number is owned by an
         analyst desk (cap 2 per run).
      4. write_scratchpad with compact NEW claims or tool findings
         (author=bear). Your finished 4-6 bullets are copied onto the
         pad automatically — do not paste that whole turn.

    Then state the strongest bearish argument in 4-6 bullets, each tied
    to a scratch-pad TLDR, a prior debate turn, or a tool you just called.

    Round-{round_num} discipline (REQUIRED — the runner persists every
    round separately now, so duplicate rounds are visible to the
    reviewer):
      * If round_num == 1: this is your OPENING, run in parallel with
        the bull. Write an independent first bearish case from the
        analyst TLDRs and your own tools. Open with your strongest
        4-6 downside drivers. Do NOT open with ``REBUTTAL:`` and do
        NOT wait for or attack a bull turn — even if a bull opening
        is already on the pad, ignore it this round.
      * If round_num > 1: this turn MUST be materially different from
        your round (round_num - 1).  Specifically:
          (a) Open with one or more ``REBUTTAL:`` lines that paste the
              exact bull bullet (with its ``[source: …]`` tag) you are
              attacking, followed by 1-2 lines explaining why it does
              not hold. Repeat for the next strongest bull bullet if
              space allows.
          (b) Introduce AT LEAST ONE risk that draws on a non-yfinance
              lens (news / social / macro / geopolitical / sector /
              quant) that you did not lead with in round
              (round_num - 1).
          (c) Add a "Conviction vs prior round: ↑ / → / ↓ — <reason>"
              line tracking how your downside conviction has shifted.
          (d) Do NOT repeat any prior-round bullet verbatim.

    PROVENANCE: copy each ``[source: <identifier>]`` tag from the pad
    or from a tool you called this turn. You MAY introduce numbers
    that came from those tool calls, with their tags. Do NOT invent
    numbers.
  expected_output: >
    Bear argument for round {round_num} (bulleted; for round_num == 1
    an independent opening with no ``REBUTTAL:`` line; for
    round_num > 1 starts with one or more ``REBUTTAL:`` lines pasting
    the bull bullet under attack, introduces at least one new analyst
    lens vs the previous bear round, and ends with a
    ``Conviction vs prior round:`` line).
    Every numeric claim carries an inline ``[source: …]`` tag.

# ----- Bundled live debate (one crew, both sides, tools mid-exchange) --------

debate_bull_open:
  description: >
    Bundled debate OPENING (BULL) for {ticker}. You share this crew with
    the bear. Open your case, then they will rebut you, then you close.

    Call tools during this opening when a claim needs a number, a
    filing fact, a headline, or a web source you do not already have.
    Useful tools: read_scratchpad (first), research_web (write a fresh
    query), get_news, get_stock_data, get_fundamentals,
    get_analyst_recommendations, get_event_proximity, write_scratchpad
    (author=bull). Do not invent figures.

    State the strongest bullish argument in 4-6 bullets, each tied to a
    scratch-pad TLDR or a tool you just called. Every number carries
    ``[source: …]``. End with DESK_BIAS: BULLISH (or BEARISH / NEUTRAL).
  expected_output: >
    Cited bull opening for {ticker}: drivers, what would flip you.
    Every number carries [source: …]. Last line DESK_BIAS: BULLISH
    (or BEARISH / NEUTRAL).

debate_bear_rebut:
  description: >
    Bundled debate REBUTTAL (BEAR) for {ticker}. The bull opening is in
    this crew's prior task. Attack their strongest cited bullets. Fetch
    new evidence yourself — do not only restate analyst TLDRs.

    Call tools when a rebuttal hinges on a number, a headline, or a
    web source you do not have: read_scratchpad, research_web (fresh
    query that names the claim you are testing), get_news,
    get_stock_data, get_fundamentals, get_analyst_recommendations,
    get_event_proximity, write_scratchpad (author=bear).

    Open with one or more ``REBUTTAL:`` lines that paste the bull
    bullet (with its ``[source: …]`` tag) you are attacking. Then 4-6
    bearish bullets. End with DESK_BIAS: BEARISH (or BULLISH / NEUTRAL).
  expected_output: >
    Cited bear rebuttal for {ticker}: REBUTTAL lines, downside drivers,
    what would flip you. Every number carries [source: …]. Last line
    DESK_BIAS: BEARISH (or BULLISH / NEUTRAL).

debate_bull_close:
  description: >
    Bundled debate CLOSE (BULL) for {ticker}. The bear rebuttal is in
    this crew's prior tasks. Answer their strongest attack. Call tools
    again if a new claim needs a source you do not have (research_web,
    get_news, get_fundamentals, get_stock_data). Do not recap your
    opening verbatim.

    Open with ``REBUTTAL:`` pasting the bear bullet you are answering.
    Then 3-5 bullets that move conviction vs your opening. End with
    DESK_BIAS: BULLISH (or BEARISH / NEUTRAL) and
    ``Conviction vs opening: ↑ / → / ↓ — because <one cited line>``.
  expected_output: >
    Cited bull close for {ticker}: REBUTTAL lines, updated drivers,
    Conviction vs opening. Every number carries [source: …]. Last line
    DESK_BIAS: BULLISH (or BEARISH / NEUTRAL).

# ----- Bundled risk debate (one crew, three wings, two rounds) ---------------

risk_aggressive_open:
  description: >
    Bundled risk ROUND 1 OPENING (AGGRESSIVE) for {ticker}. You share
    this crew with Conservative and Neutral. Write your independent
    size-up / proactive-path opinion from the thesis and plan. Do NOT
    open with ``REBUTTAL:``. Do not wait for or attack the other wings.

    Call tools when a size claim needs a number you do not have:
    research_web, get_news, get_stock_data, get_fundamentals,
    get_options_summary, get_event_proximity. Do not invent figures.
    End with a recommended size (pct of book) and what would flip you.
  expected_output: >
    Independent aggressive opening for {ticker}: size call, named
    risks, what would flip you. Every number carries [source: …].
    No REBUTTAL: line.

risk_conservative_open:
  description: >
    Bundled risk ROUND 1 OPENING (CONSERVATIVE) for {ticker}. You share
    this crew with Aggressive and Neutral. Write your independent
    size-down / skip / tighter-stop opinion from the thesis and plan.
    Do NOT open with ``REBUTTAL:``. Do not wait for or attack the
    other wings.

    Call tools when a tail-risk claim needs a number you do not have:
    research_web, get_news, get_stock_data, get_fundamentals,
    get_options_summary, get_event_proximity. Do not invent figures.
    End with a recommended size (pct of book) and what would flip you.
  expected_output: >
    Independent conservative opening for {ticker}: size call, named
    tail risks, what would flip you. Every number carries [source: …].
    No REBUTTAL: line.

risk_neutral_open:
  description: >
    Bundled risk ROUND 1 OPENING (NEUTRAL) for {ticker}. You share this
    crew with Aggressive and Conservative. Write YOUR independent
    book-defensible size opinion first — this is not yet a synthesis
    of the other wings. Do NOT open with ``REBUTTAL:``.

    Call tools when a size claim needs a number you do not have:
    research_web, get_news, get_stock_data, get_fundamentals,
    get_options_summary, get_event_proximity. Do not invent figures.
    End with a recommended size (pct of book) and what would reopen
    the plan.
  expected_output: >
    Independent neutral opening for {ticker}: size call, named risks,
    what would reopen the plan. Every number carries [source: …].
    No REBUTTAL: line.

risk_aggressive_rebut:
  description: >
    Bundled risk ROUND 2 DEBATE (AGGRESSIVE) for {ticker}. The three
    openings are in this crew. Attack the strongest conservative or
    neutral size-down bullets. Fetch new evidence — do not only restate
    your opening.

    Open with ``REBUTTAL:`` pasting the other-wing bullet (with
    ``[source: …]``) you are countering. Call research_web / get_news /
    get_fundamentals / get_stock_data if you need a source. End with
    ``Conviction vs opening: ↑ / → / ↓ — <reason>`` and an updated
    size (pct of book).
  expected_output: >
    Aggressive rebuttal for {ticker}: REBUTTAL lines, updated size,
    Conviction vs opening. Every number carries [source: …].

risk_conservative_rebut:
  description: >
    Bundled risk ROUND 2 DEBATE (CONSERVATIVE) for {ticker}. The three
    openings are in this crew. Attack the strongest aggressive size-up
    bullets. Fetch new evidence — do not only restate your opening.

    Open with ``REBUTTAL:`` pasting the other-wing bullet (with
    ``[source: …]``) you are countering. Call research_web / get_news /
    get_fundamentals / get_stock_data if you need a source. End with
    ``Conviction vs opening: ↑ / → / ↓ — <reason>`` and an updated
    size (pct of book).
  expected_output: >
    Conservative rebuttal for {ticker}: REBUTTAL lines, updated size,
    Conviction vs opening. Every number carries [source: …].

risk_neutral_rebut:
  description: >
    Bundled risk ROUND 2 DEBATE (NEUTRAL) for {ticker}. The three
    openings and the wing rebuttals are in this crew. Debate both
    sides, then lock one book-defensible size. Fetch a source if a
    claim is still uncited.

    Open with ``REBUTTAL:`` pasting the wing bullet you reject or
    accept. Call research_web / get_news / get_fundamentals /
    get_stock_data if a claim is still uncited. End with recommended
    size (pct of book) and
    ``Conviction vs opening: ↑ / → / ↓ — <reason>``. Do not emit
    graph control tokens.
  expected_output: >
    Neutral rebuttal for {ticker}: REBUTTAL lines, locked size,
    Conviction vs opening. Every number carries [source: …].

# ----- Research synthesis ----------------------------------------------------

research_synthesis:
  description: >
    As Research Manager, call read_scratchpad for compact analyst TLDRs
    and the debate history. The last bull and last bear turns are also
    in context — do not expect the five full analyst reports here.
    Pick the
    side with stronger evidence when one side is clearly stronger.
    If the desks conflict and neither side is clearly stronger, emit
    STANCE: MIXED with named evidence on both sides and 1-2 things
    that would change your mind. MIXED is a locked thesis, not a
    sit-out instruction — do not tell the PM to sit out. HOLD is
    the PM's call only when the
    directional desk vote is tied (bullish count == bearish count,
    both > 0) or a majority of directional desks oppose the lean.
    Neutrals do not create a split: 3 bullish / 2 neutral is a
    bullish majority, not a split board.

    Multi-lens grounding (REQUIRED — anti yfinance-only bias).
    Reports tend to collapse onto market + fundamentals because those
    analysts emit hard yfinance numbers and the prompt rewards
    quantitative citations.  Counter that explicitly:

      * Across the 3 KEY DRIVERS and the 3 KEY RISKS combined, at
        least **TWO** entries must source primarily from a NON-yfinance
        lens — i.e. the underlying ``[source: …]`` tag must be a news
        URL, an article from get_corporate_actions, a
        get_report_insights / SIGNAL line, a macro-basket
        line tied to a news headline, a geopolitical / supply-chain
        item, a sector / peer comparison, or an options/quant
        indicator that is not just a yfinance fundamentals figure.
      * If the Reports desk emitted a NET_GUIDANCE_BIAS or a computed
        REVENUE/EARNINGS/MARGIN_TREND, that read MUST appear in drivers,
        risks, or falsifiers — not silently dropped because the filing
        digest feels softer than a yfinance multiple.
      * If the News, Social, Geopolitical, or Macro reports surfaced
        a material catalyst (e.g. share buyback, special dividend,
        acquisition, leadership change, sanctions action), that
        catalyst MUST appear in either the drivers or the risks (or
        in falsifiers if it's the single thing that would flip the
        thesis) — not silently dropped because the headlines feel
        soft compared to yfinance numbers.
      * If an analyst was DEGRADED (their report opens with
        ``[[DEGRADED_TOOL_CALL_OUTPUT]]``), explicitly note "the X
        lens was unavailable this run" instead of pretending the
        analysis is complete — that drop is itself a risk factor for
        the trader to know about.

    PROVENANCE: every quantitative driver / risk / falsifier MUST carry
    the underlying ``[source: <identifier>]`` tag copied VERBATIM from
    the analyst report you took the figure from (same URL / tool id,
    not a paraphrased host). A tagged news URL is complete — do not
    drop the fact because a later reviewer cannot re-find the article.
    The trader and the Portfolio Manager rely on these tags — strip
    them and the Reflective Critic will mark the decision unsupported.
  expected_output: >
    A RESEARCH THESIS with: STANCE (BULL/BEAR/MIXED), 3 key drivers, 3 key
    risks (with at least TWO entries across drivers+risks sourcing
    from a non-yfinance lens — news, corporate actions, reports/guidance,
    geopolitical, macro headlines, sector peers, options/quant), 1-2 falsifiers,
    and (if any analyst was degraded) a one-line note flagging the
    missing lens.  Every line that contains a number ends with an
    inline ``[source: …]`` tag.

# ----- Quality review --------------------------------------------------------

quality_review:
  description: >
    Audit the Research Manager's thesis. For every claim, mark
    SUPPORTED, SUPPORTED-qualitative, or UNSUPPORTED using the rules
    below — then grade evidence-grounding 0-10 and list 1-3 gaps.
    Recommend size reduction ONLY if the score is below 4 (a genuine
    thesis-wide hole: most material numbers have no tag at all). A
    4-10 thesis is "actionable with caveats", not "size-down" and not
    "weight the tagged levers down".

    SUPPORTED — the claim already carries an inline
    ``[source: <identifier>]`` tag. The tag IS the citation. Accept
    any of: an ``http``/``https`` URL, a tool identifier
    (``yfinance …``, ``screener.in …``, ``get_report_insights``,
    ``long_term_thesis``), or a desk label (``Fundamentals Analyst
    TLDR``). Do NOT require that same URL to reappear as prose in
    another desk report. Your context is truncated; a tagged news
    URL that you cannot grep in the analyst pack is still SUPPORTED.
    Do NOT tell the trader or PM to omit, drop, or down-weight a
    tagged claim.

    SUPPORTED-qualitative — the claim is labelled
    ``[analyst judgement]``. Honest view, not a fatal gap. Keep it.

    UNSUPPORTED — only an UNTAGGED bare number, or a citation that
    points at a fabricated / placeholder URL (``example.com``, a
    made-up path). Flag those so the PM can ignore THAT number.
    A single missing tag NEVER triggers a size-down.
  expected_output: >
    A QUALITY REVIEW with: per-claim audit (SUPPORTED with the tag it
    cites / SUPPORTED-qualitative for ``[analyst judgement]`` labels /
    UNSUPPORTED only for a missing-tag or fabricated-URL),
    overall score X/10, and 1-3 gap statements. Do not recommend
    dropping tagged claims.

# ----- Trader ----------------------------------------------------------------

trader_task:
  description: >
    As the trader, turn the Research Manager's thesis into a concrete
    plan for {ticker}.  This desk operates across three horizon tiers:

      * **SHORT** — up to 60 trading days (~3 months). Catalyst /
        event trades, technical breakouts.  The exception, not the rule.
      * **MEDIUM** — 61–252 days (~few months to a year).  The desk's
        DEFAULT.  Most Ind-AS / earnings-driven theses live here.
      * **LONG** — 253+ days (1–10 years).  A compounder / value thesis
        anchored on multi-year fundamentals; requires
        ``get_long_term_thesis`` evidence from the fundamentals analyst.

    Pick the horizon tier based on the CHARACTER of the analyst
    evidence.  The thesis you were handed will naturally live on one
    of these time-scales:

      * A multi-year compounder / value / structural-break thesis
        (revenue + EPS CAGR, ROCE trend, balance-sheet re-rating,
        multi-year debt collapse or debt build-up) => LONG.
      * A quarterly / annual earnings-and-margin trajectory,
        sector-rotation, or valuation-mean-reversion thesis => MEDIUM.
      * A discrete near-term catalyst (specific earnings print, FDA
        decision, buyback close, index-inclusion date) => SHORT.

    The horizon comes from the CHARACTER of the thesis (above) — a
    forward-looking view built on the analyst evidence.  Do NOT
    downgrade a genuine multi-year thesis to a shorter window on the
    basis of how the stock behaved historically: past price paths were
    measured in a different regime.  Take any home-country cycle call
    from the macro desk's evidence, never from a standing prior.
    A structural-break SELL on collapsing ROCE is a LONG-tier trade;
    a multi-year compounder BUY is a LONG-tier trade — regardless of
    what the last few years of prices did.

    Learning clock vs thesis clock (do NOT collapse them):
      The desk scores a 30-calendar-day LEARNING review (~21 trading
      days) against ``trading_crew/config/desk_strategy.yaml`` success
      and failure bars.  That clock does not replace the thesis
      horizon.  Pick SHORT / MEDIUM / LONG from the CHARACTER of the
      thesis.  Do NOT shrink a MEDIUM/LONG thesis to 30 days just to
      feed the learning loop — the loop snapshots the 30-day path
      automatically.  Edit the YAML to change the bars or the one
      open experiment; change only one process knob at a time.

    Mandatory workflow:
      1. Call get_event_proximity once. If days_to_event is less than
         60 days, plan a position that *survives* the catalyst rather
         than races against it — keep horizon_days >= 60 and either
         (a) widen the stop to absorb the post-event volatility while
         keeping the longer-horizon target, or (b) explicitly note the
         catalyst as a milestone within the mid-term thesis.  ONLY
         shorten horizon_days below 60 when the entire trade rationale
         is a near-term event (e.g. a binary FDA decision) and say so
         in plain English.
      2. Draft direction, entry, stop, target, horizon_days, and an
         initial size as a fraction of risk budget.  Choose
         horizon_days by tier:
           * SHORT plans: horizon_days in [10, 60].
           * MEDIUM plans (default): horizon_days in [90, 252].
           * LONG plans: horizon_days in [504, 1260] (representative
             day-counts, meaning a 2–5 year *review* window; the
             underlying thesis is 5–10 years but outcome resolution
             can't wait a decade).
         Targets and stops must match the horizon:
           * A SHORT target is a multi-percent move (e.g. 5–15%).
           * A MEDIUM target is typically a 10–35% multi-quarter move.
           * A LONG target is a multi-year total return (e.g. +80–200%
             for 5y) — anchor it on the revenue / EPS CAGR from the
             long-term-thesis tool, not a chart level.
         STOP PLACEMENT — ground it in measured volatility, not a made-up
         ATR.  Read the "Annualised volatility (1y trailing)" line from
         get_stock_data; a rough 1-day move ≈ that vol / 16.  The stop must
         clear normal noise over the HOLDING PERIOD, so a multi-month /
         multi-year trade needs a much wider band than a 2-3% day-trade
         stop — a stop only a couple of percent from entry on a 6-month+
         horizon is wrong and will be widened downstream.  Do NOT invent an
         "ATR252 = X" number; if you reference volatility, quote the
         get_stock_data vol line verbatim with its ``[source: …]`` tag.  A
         deterministic risk check will widen any stop that is too tight for
         the horizon+volatility, so place a realistic one yourself.
      3. If the Research Manager flagged a degraded / missing analyst
         lens or a thin-evidence risk, reduce your default size by 25%
         and explicitly cite the gap.  Otherwise keep the size and
         address any caveats in the rationale.

    Size the position from the STRENGTH and BREADTH of the forward
    thesis (how many analyst lenses agree, how one-sided the
    fundamentals are, catalyst proximity), not from how the stock
    performed historically.

    PROVENANCE: tag earnings-window figures with
    ``[source: yfinance .calendar + .earnings_dates {ticker}]``.  Keep
    every analyst-figure tag the manager handed down — the PM uses
    those to populate the decision's ``sources`` list.
  expected_output: >
    A TRADE PLAN with: direction, entry, stop, target, horizon_days,
    the horizon tier label (SHORT / MEDIUM / LONG), days_to_earnings,
    and the sizing rationale. The plan states plainly which tier
    the desk should adopt and why (grounded in the forward thesis,
    not historical price behaviour).  Every numeric claim carries an
    inline ``[source: …]`` tag.

# ----- Risk debate (per-round tasks generated in code) ----------------------

risk_aggressive_round:
  description: >
    Risk round {round_num} of {total_rounds} (AGGRESSIVE turn). Argue for
    higher conviction sizing or a more proactive execution path from
    the trader's plan.

    Round-{round_num} discipline (REQUIRED — same contract as bull/bear):
      * If round_num == 1: this is your OPENING, run in parallel with
        Conservative. Write an independent first size-up case from the
        thesis and the trader's plan. Do NOT open with ``REBUTTAL:``
        and do NOT wait for or attack a conservative turn — even if
        one is already in context, ignore it this round.
      * If round_num > 1: this turn MUST be materially different from
        your round (round_num - 1). Specifically:
          (a) Open with "REBUTTAL:" pasting the Conservative bullet
              (with ``[source: …]`` tag) you are countering, then 1-2
              lines why.
          (b) Introduce at least one NEW size-up driver not used in
              your earlier aggressive round.
          (c) End with "Conviction vs prior round: ↑ / → / ↓ — <reason>".
          (d) Do NOT repeat any prior-round bullet verbatim.

    PROVENANCE: keep every ``[source: …]`` tag from the figures you cite.
  expected_output: >
    Aggressive risk argument round {round_num} (for round_num == 1
    an independent opening with no ``REBUTTAL:`` line; for
    round_num > 1 starts with ``REBUTTAL:``, ends with
    ``Conviction vs prior round:``).  Each numeric claim carries an
    inline ``[source: …]`` tag.

risk_conservative_round:
  description: >
    Risk round {round_num} of {total_rounds} (CONSERVATIVE turn). Argue
    for tighter stops, smaller size, or skipping the trade.

    Round-{round_num} discipline (REQUIRED — same contract as bull/bear):
      * If round_num == 1: this is your OPENING, run in parallel with
        Aggressive. Write an independent first size-down / skip case
        from the thesis and the trader's plan. Do NOT open with ``REBUTTAL:``
        and do NOT wait for or attack an aggressive
        turn — even if one is already in context, ignore it this
        round.
      * If round_num > 1: this turn MUST be materially different from
        your round (round_num - 1). Specifically:
          (a) Open with "REBUTTAL:" pasting the Aggressive bullet you
              are countering (with its ``[source: …]`` tag) then 1-2
              lines why the size-up case does not hold.
          (b) Introduce at least one NEW size-down driver not used in
              your prior conservative round.
          (c) End with "Conviction vs prior round: ↑ / → / ↓ — <reason>".
          (d) Do NOT repeat any prior-round bullet verbatim.

    PROVENANCE: keep every ``[source: …]`` tag from the figures you cite.
  expected_output: >
    Conservative risk argument round {round_num} (for round_num == 1
    an independent opening with no ``REBUTTAL:`` line; for
    round_num > 1 starts with ``REBUTTAL:``, ends with
    ``Conviction vs prior round:``).  Each numeric claim carries an
    inline ``[source: …]`` tag.

risk_neutral_round:
  description: >
    Risk round {round_num} of {total_rounds} (NEUTRAL turn). Synthesize
    the aggressive and conservative arguments into a balanced
    sizing/execution recommendation for this round.

    For round_num > 1, the synthesis MUST acknowledge how your verdict
    has shifted vs the prior neutral round.  End with: "Recommended
    size shift vs prior round: +X bps / 0 / -X bps — <reason>".

    PROVENANCE: keep every ``[source: …]`` tag from the figures you cite.
  expected_output: >
    Neutral risk synthesis round {round_num} (for round_num > 1: ends
    with a "Recommended size shift vs prior round:" line).  Each
    numeric claim carries an inline ``[source: …]`` tag.

# ----- Compliance gate -------------------------------------------------------

compliance_review:
  description: >
    Review the trade plan and the risk debate for compliance: sanctions /
    export-control collisions (e.g. chip-export rules, Russia sanctions),
    restricted-list overlaps, ESG red flags, and conflict-of-interest
    concerns. Issue ONE of: CLEAR / FLAGGED / BLOCKED, with explicit
    rationale and any size-cap recommendation.

    Calibrate the status to the SEVERITY of what you can actually
    establish:
      * BLOCKED is reserved for a CONCRETE, established hit — the name
        (or a controlling entity) is on a sanctioned / restricted /
        SDN list, or a specific legal prohibition applies.  A merely
        UNVERIFIABLE exposure (e.g. "may have some revenue from a
        sensitive region" with no confirming source) is NOT grounds
        for BLOCKED.
      * FLAGGED (with a size cap) is the right response to an
        unverifiable or partial exposure concern — right-size the
        position, do not veto it.  An unverifiable claim should reduce
        conviction / size, never force the desk to HOLD.
      * CLEAR when nothing material surfaces.

    PROVENANCE: any factual claim (e.g. "X is on the SDN list",
    "Y% revenue from Russia") MUST cite a tagged analyst figure or a
    news URL. Use ``[source: <url>]`` for news, or copy the analyst's
    inline tag.  A qualitative compliance concern with no citable
    source must be labelled ``[analyst judgement]`` and treated as a
    FLAGGED / size-cap input, never a BLOCKED trigger.
  expected_output: >
    A COMPLIANCE REVIEW with: status (CLEAR / FLAGGED / BLOCKED), specific
    concerns (each with an inline ``[source: …]`` tag if quantitative),
    and size-cap recommendation.

# ----- Portfolio Manager final decision (typed Pydantic output) -------------

pm_decision:
  description: >
    As Portfolio Manager, weigh ALL FIVE analyst reports
    (market/positioning, news/sentiment, fundamentals/sector,
    reports/guidance, macro/geopolitical), the trader's plan, and the risk debate. If a
    Quality Review audit and/or a Compliance review are present in
    context, treat them as ADVISORY inputs: a Quality Review score
    below 4 or a FLAGGED compliance status should right-size (cut) the
    position, never by itself force a HOLD.  Do NOT drop, omit, or
    down-weight a claim that already carries a real ``[source: …]``
    tag (an ``http``/``https`` URL, ``screener.in``, ``yfinance``,
    ``get_report_insights``, or a desk TLDR) just because Quality
    Review marked it UNSUPPORTED — that audit cannot re-see every
    article in its window. Only ignore an untagged bare number or an
    ``example.com`` placeholder.  Issue ONE final decision
    on {ticker}.

    Decisiveness guard — you are making a researched, decisive call on
    {ticker}, NOT answering an ambiguous user request:
      * The analyst reports, trader plan, and risk debate in your
        context ARE specifically about {ticker} and contain real,
        citable figures.  Use them.  Never write "the request is
        ambiguous", "no specific sources", "placeholder", or a generic
        market summary — that is a hard failure and will be rejected.
      * key_drivers / key_risks / falsifiers MUST each name a concrete
        piece of analyst evidence with its inline ``[source: …]`` tag
        (e.g. "price 1253.90 below SMA20/SMA50/SMA200, RSI 37.73
        [source: yahoo · ohlcv]", "CFO transition", "India VIX
        collapsed to 12.1", "mean target 1584.43 vs spot").  Never
        generic labels like "Momentum", "Volume", "Market volatility",
        "Economic data releases", or "Geopolitical events" without a
        tagged {ticker}-specific figure.
      * entry_price / stop_loss / target_price: ground entry to
        LAST_CLOSE (injected) or the last market close in the market
        analyst report. Copy the trader's levels only when they sit
        within a few percent of that print. Never invent a round
        placeholder (100 / 50 / 10 / $10 / $12 / $8) and never copy a
        trader entry that is tens of percent away from spot. Size stop
        and target off the measured volatility cited in context.
      * If the analyst evidence is genuinely one-sided, commit to the
        matching directional tier and explain WHY with tagged figures —
        do not retreat to a generic HOLD or a placeholder trade merely
        because one analyst lens was degraded.  A degraded lens is a
        reason to cut size, not to emit a placeholder decision.

    Action alphabet — 5-tier, retail-recognisable:
      Choose ``action`` from EXACTLY ONE of:

        * ``STRONG_BUY``  — high-conviction long.  Reserve for cases
                            where the analyst thesis is CLEARLY bullish
                            and one-sided across the mid-/long-term
                            fundamentals (revenue + EPS CAGR, ROCE,
                            valuation, macro / sector alignment), with
                            AT LEAST one independent corroboration
                            beyond a single analyst report — a
                            sector/peer confirmation, a macro tailwind,
                            a news catalyst, or a supportive
                            get_long_term_thesis output.  A strong,
                            broad forward thesis is sufficient; you do
                            NOT need historical price-simulation
                            evidence to justify conviction.
                            Typical shape: size_pct_of_book >= 2.0 and
                            confidence in [0.70, 0.88].
        * ``BUY``         — standard long.  Directional thesis is
                            supported but conviction or edge doesn't
                            warrant STRONG_BUY.  Typical shape:
                            size_pct_of_book in (0, 2.0] and confidence
                            in [0.55, 0.75].
        * ``HOLD``        — sit out. ``size_pct_of_book`` MUST be 0.
                            Choose when the desk-bias board is split or
                            majority-opposed to a directional call, when
                            directional evidence is genuinely mixed,
                            when neither the short-term nor the
                            mid-/long-term panels have a meaningful
                            edge, or when compliance forces a stand-down.
        * ``SELL``        — standard short (mirror of BUY).
        * ``STRONG_SELL`` — high-conviction short (mirror of STRONG_BUY).

      Do NOT emit the legacy labels ``OVERWEIGHT`` / ``UNDERWEIGHT`` /
      ``NEUTRAL``.  The schema still accepts them for backwards
      compatibility but they will be silently rewritten and the UI will
      display the collapsed BUY / SELL / HOLD form.

    Time horizons — REQUIRED reasoning (3-tier: SHORT / MEDIUM / LONG):
      Every decision MUST populate BOTH:

        * ``horizon_days`` — the primary review-window in trading days.
        * ``horizon`` — one of ``SHORT`` (≤60d, ≤3 months),
          ``MEDIUM`` (61–252d, ~few months to a year), or ``LONG``
          (253+ days, 1–10 year buy-and-hold thesis).

      **Pick the horizon that matches the CHARACTER of the thesis.**
      The horizon is a forward-looking judgement built on the analyst
      evidence — how the stock behaved historically does NOT set it:

        * LONG (253+ days): a multi-year compounder / value thesis
          OR a multi-year structural-break thesis (e.g. ROCE
          collapse, debt spiral, terminal-value re-rating).  Escalate
          to LONG when the analyst evidence names multi-year
          fundamentals — revenue / EPS CAGR (positive for BUY,
          deteriorating for SELL), ROCE trend, balance-sheet quality,
          valuation vs peers.  A ``get_long_term_thesis`` report you
          can cite (``[source: long_term_thesis ...]``) is much
          stronger corroboration, but its absence does not
          automatically disqualify LONG — the multi-year evidence may
          still be sufficient.
        * MEDIUM (61-252d): a quarterly-to-annual earnings /
          margin / macro trajectory thesis, sector-rotation, or
          valuation-mean-reversion play.  This is the DEFAULT ONLY
          if the thesis doesn't naturally fit LONG or SHORT.
        * SHORT (up to 60d): a genuine discrete near-term catalyst
          (specific earnings beat, buyback close, FDA print, index
          inclusion).  Do NOT pick SHORT for a genuine multi-year
          thesis just to shorten the review window.

      Learning clock vs thesis clock:
        A 30-calendar-day review (~21 trading days) is scored against
        the success/failure bars in desk_strategy.yaml.  That is the
        self-learn signal.  Your ``horizon_days`` remains the thesis
        clock (MEDIUM/LONG stay).  Do not emit horizon_days=30 unless
        the thesis itself is a dated catalyst.

      The decision is anchored on the ANALYST EVIDENCE (fundamentals,
      reports/guidance, macro, sector, news, geopolitical), the trader's
      plan, and (for LONG-tier calls) the multi-year fundamentals.  Take
      any home-country cycle / regime call from the macro desk — do not
      assume an upcycle for any country.  Do not let historic price
      behaviour dictate the direction, the tier, or the size.

      Desk-bias board — BINDING coverage check:
        * A split board means bullish count == bearish count, both > 0.
          Neutrals do not create a split (3 bullish / 2 neutral is a
          bullish majority). A 3–1 directional majority is not a split.
        * A true split, or a majority of directional desks against your
          side, is HOLD — not a weak BUY/SELL. Override a dissenting
          desk only with specific tagged evidence that desk missed;
          otherwise sit out.
        * STRONG_BUY / STRONG_SELL require a one-sided board (no
          opposing desk).  Any opposing desk caps you at BUY / SELL.
        * Weight computed REVENUE_TREND / EARNINGS_TREND / MARGIN_TREND
          (hard quarterly numbers) at least as heavily as LLM-read
          OUTLOOK_TONE — management filings are structurally optimistic.

      Populate ``long_term_view`` on EVERY decision — it is the
      permanent home of the multi-year context in the final report,
      independent of the chosen tier:
        * horizon == LONG: 2-5 sentence narrative tying revenue / EPS
          CAGR + ROCE trend to the multi-year target return.  Lead
          with the FUNDAMENTALS (cite the ``[source: long_term_thesis
          ...]`` tag if available).
        * horizon in {SHORT, MEDIUM}: 1-2 sentence "the multi-year
          compounding thesis is intact / broken / not applicable"
          line, LEADING with the fundamental picture (revenue /
          margin / ROCE trend, valuation).  If no long-term data is
          available, write "Long-term data unavailable for this
          ticker" — never leave the field empty.

      HOLD is reserved for cases where the analyst evidence is
      genuinely mixed (split or majority-opposed desk board, conflicting
      mid- vs long-term fundamentals), OR none of them have a meaningful
      edge.

    Decision quality — when to express conviction:
      Default to a directional tier (BUY / STRONG_BUY / SELL /
      STRONG_SELL) whenever the ANALYST EVIDENCE supports a
      directional thesis.  A strong qualitative thesis backed by
      fundamentals + at least one corroborating lens is a directional
      tier — you do NOT need historical price-simulation evidence to
      commit.

      Upgrade to STRONG_BUY / STRONG_SELL only when the analyst
      evidence is one-sided across the mid- AND long-term horizons
      AND the desk-bias board has no opposing desk AND at least one
      independent corroboration (sector alignment OR macro tailwind
      OR news catalyst OR reports/guidance OR ``get_long_term_thesis``)
      points the same way.

      Weight the MULTI-YEAR compounding picture (revenue / EPS CAGR,
      ROCE trend, structural pros/cons from get_long_term_thesis) at
      LEAST as heavily as the near-term signal.  When the long-term
      thesis is intact and the fundamentals are strong, prefer the LONG
      horizon and let the multi-year evidence, not a soft near-term
      wobble, drive the tier.

      HOLD is the correct call on a true split (bull == bear, both > 0)
      or a majority-opposed desk board — do not use it as a "soft veto"
      when the board is MIXED-with-conviction but has a directional
      majority, when one signal is mildly weak, when only the
      short-term picture is weak, or when you are uncertain about a
      single quantitative claim.  A HOLD with size 0 is a real
      position decision (sit out).

      A well-reasoned QUALITATIVE thesis stands on its own.  When the
      fundamentals + macro + sector lenses align on a direction, that
      is a directional call even if some supporting context is labelled
      ``[analyst judgement]`` rather than backed by a URL for every
      sentence.  A missing or unverifiable source downgrades the weight
      of THAT ONE claim — never the whole thesis, and never into a
      HOLD.  Do NOT convert a clear directional thesis into HOLD merely
      because a citation is qualitative or an exposure claim is
      unverifiable — cut the size (or defer to the compliance cap)
      instead.

    Hard rules:
      - If compliance_status is BLOCKED, action MUST be HOLD and
        size_pct_of_book MUST be 0.
      - If compliance_status is FLAGGED, cap size_pct_of_book at 1.0
        and explain.  A FLAGGED compliance status is compatible with
        any directional tier as long as the size cap is honoured.
      - HOLD ⇒ size_pct_of_book == 0.  Any directional tier ⇒
        size_pct_of_book > 0.  The guardrail rejects mismatches.
        A HOLD may still carry watch stop/target/expected-return
        levels filled by the risk layer after you emit — those are
        not a live order. Do not put a recommended size into
        size_pct_of_book on HOLD.
      - confidence is a probability in [0, 1]; calibrate it to the
        evidence (do not output a 0.50 placeholder); never claim >0.88
        on a single-name trade.
      - expected_return_pct is a DECIMAL FRACTION over the horizon, NOT
        percent points: +5% => 0.05, +20% => 0.20, -12% => -0.12.  Its
        SIGN is the expected move of the underlying: POSITIVE for a
        BUY/STRONG_BUY thesis (you expect the price to rise) and
        NEGATIVE for a SELL/STRONG_SELL thesis (you expect it to fall).
        It must be consistent with (target_price - entry_price)/entry_price.
        Emitting 20 instead of 0.20, or a positive value on a short, is a
        schema violation.
      - Confidence is set by the STRENGTH and BREADTH of the forward
        analyst evidence.  Apply the cap "do not exceed confidence
        0.6" ONLY when the qualitative analyst evidence (fundamentals,
        macro, sector, news, geopolitical) is genuinely weak or
        contradictory across lenses.  A clear, broad thesis warrants
        conviction commensurate with how one-sided the evidence is.
      - ``long_term_view`` MUST be non-empty on EVERY decision.  When
        horizon == LONG it is a 2-5 sentence narrative; when horizon in
        {SHORT, MEDIUM} it is a 1-2 sentence "thesis intact / broken /
        N/A" line.  An empty string is a schema violation the
        Reflective Critic will treat as UNSUPPORTED.

    PROVENANCE — non-negotiable, the Reflective Critic checks this:
      - The ``rationale`` MUST keep every ``[source: <identifier>]``
        tag from the figures you cite. If you can't keep the tag, omit
        the figure.
      - A qualitative point with no citable source is written with an
        ``[analyst judgement]`` label — this is honest and acceptable.
        NEVER invent a URL or a placeholder link (``example.com``, a
        made-up path) to satisfy the provenance rule: a fabricated
        citation is a hard integrity failure the Reflective Critic will
        flag and strip, whereas an honest ``[analyst judgement]`` label
        is fine.
      - The ``sources`` field MUST be a deduplicated list of those
        ``<identifier>`` strings (just the bit inside the brackets,
        without "[source: " and "]"). Every distinct identifier you
        cite in the rationale, drivers, risks, or falsifiers must
        appear in ``sources``; no extras, no missing ones.  Do NOT put
        ``analyst judgement`` in ``sources`` — it is a label, not a
        source identifier.
      - ``key_drivers`` / ``key_risks`` / ``falsifiers`` entries that
        contain numbers also carry an inline ``[source: …]`` tag.
      - If you have no quantitative evidence to cite, lower
        ``confidence`` and acknowledge it in the rationale rather than
        inventing a figure.

    Return ONLY a JSON object that matches the PortfolioDecision schema.
    Populate geopolitical_flags from the geopolitical / supply-chain
    section of the macro report. Populate compliance_status from the
    compliance review if present, else "CLEAR". Populate ``sources``
    per the rule above.
  expected_output: >
    A JSON object matching the PortfolioDecision schema, with all fields
    populated, every numeric claim carrying an inline ``[source: …]``
    tag in the rationale/drivers/risks/falsifiers, and a deduplicated
    ``sources`` list that mirrors those tags.
